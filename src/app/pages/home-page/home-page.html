<app-navbar-home></app-navbar-home>

<div class="container mt-4">
    <section>
        <h1>{{title}}</h1>
        <p>Welcome to the Dashboard Server application!</p>
    </section>

    <div class="container text-center">
        <div class="row">
            @for (app of catalogApps; track $index) {
            <div class="col-12 col-lg-3 col-md-4 col-sm-6 mb-4">
                <app-application-card [appDetail]="app"></app-application-card>
            </div>
            }@empty {
                <app-no-applications></app-no-applications>
            }
        </div>
    </div>

</div>
