<nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
    <div class="container-fluid justify-content-center">
        <a class="navbar-brand" href="#">
            <img src="/iluscode_hero.png" alt="image no load" height="50"
                class="d-inline-block align-middle">
        </a>
    </div>
</nav>

<div class="container mt-4">
    <h1>{{title}}</h1>
    <p>Welcome to the Dashboard Server application!</p>

    <div class="container text-center">
        <div class="row">
            @for (app of catalogApps; track $index) {
                
            <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
                <div class="card h-100 d-flex flex-column">
                    <img src="{{app.iconImage}}" class="img-fluid mx-auto mt-4 app-home-image" alt="image not load">
                    <div class="card-body flex-grow-1">
                        <h5 class="card-title app-home-app-name">{{app.name}}</h5>
                        <p class="card-text app-home-description">{{app.description}}</p>
                    </div>
           
                    @if (""!=app.url) {
                    <div class="card-body mt-auto">
                        <a href="{{app.url}}" class="btn btn-primary" target="_blank">Go to the app</a>
                    </div>
                    }
                </div>
            </div>
            }
        </div>
    </div>

</div>
