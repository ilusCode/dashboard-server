<div class="card h-100 d-flex flex-column border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="bg-light p-3 text-center">
        <img [src]="appDetail.iconImage" class="img-fluid mx-auto app-home-image" alt="{{ appDetail.name }} icon">
    </div>

    <div class="card-body flex-grow-1 d-flex flex-column">
        <h5 class="card-title app-home-app-name fw-semibold mb-2">{{ appDetail.name }}</h5>
        <p class="card-text app-home-description text-secondary mb-0">{{ appDetail.description }}</p>
    </div>

    @if (appDetail.url && appDetail.url !== "") {
    <div class="card-footer bg-transparent border-0 pt-0 pb-3 px-3 mt-auto">
        <a [href]="appDetail.url" class="btn btn-primary rounded-pill w-100" target="_blank" rel="noopener noreferrer">Go to the app</a>
    </div>
    }
</div>
